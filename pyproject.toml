[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regression-detective"
version = "0.1.0"
description = "An autonomous agent for root-cause diagnosis of CI test regressions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-genai>=1.20",
  "langgraph>=0.3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "numpy>=1.26",
  "packaging>=23",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-json-report>=1.5"]
docker = ["docker>=7.0"]

[project.scripts]
regression-detective = "detective.__main__:main"

[tool.setuptools.packages.find]
include = ["detective*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
